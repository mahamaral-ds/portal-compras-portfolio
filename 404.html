<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada · Portal de Compras</title>
<meta name="robots" content="noindex">
<!--
  O GitHub Pages serve este arquivo para QUALQUER endereco inexistente, em qualquer profundidade
  (ex.: /repo/modules/x/nao-existe). Por isso tudo aqui e' embutido (estilo, logo e favicon) e o link
  de volta ao menu e' calculado em JavaScript, em vez de usar caminhos relativos.
-->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315306A'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%236E9BF0' stroke-width='2.2'/%3E%3Cpath d='M8.4 15.4 A7.6 7.6 0 0 1 23.6 15.4 Z' fill='%236E9BF0'/%3E%3C/svg%3E">
<style>
  :root{
    --brand:#2453A6; --brand-deep:#15306A; --brand-light:#6E9BF0;
    --ink:#121A2B; --paper:#F6F7FA; --surface:#FFFFFF; --line:#E1E5EE; --muted:#6B7385; --on-ink:#EEF1F7;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  }
  .topbar{background:var(--ink);color:var(--on-ink);padding:14px 24px;display:flex;align-items:center;}
  .topbar svg{height:24px;width:auto;display:block;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 1px 2px rgba(18,26,43,.04), 0 6px 24px rgba(18,26,43,.06);
    max-width:460px;width:100%;padding:36px 32px;text-align:center;
  }
  .code{font-size:44px;font-weight:800;letter-spacing:-.02em;color:var(--brand);margin:0;}
  .mark{display:block;width:28px;height:3px;border-radius:2px;background:var(--brand);margin:14px auto 18px;}
  h1{font-size:19px;margin:0 0 8px;}
  p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 24px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:10px 18px;border-radius:8px;
  }
  .btn:hover{background:var(--brand-deep);}
  .btn:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;}
  .btn svg{width:15px;height:15px;}
  footer{font-size:12px;color:var(--muted);text-align:center;padding:18px 16px;}
</style>
</head>
<body>

<div class="topbar">
  <svg viewBox="0 0 142 32" role="img" aria-label="Quintaluz">
    <circle cx="16" cy="16" r="13.6" fill="none" stroke="#6E9BF0" stroke-width="2.4"/>
    <path d="M6 15.2 A10 10 0 0 1 26 15.2 Z" fill="#6E9BF0"/>
    <path d="M5.2 20.4 q3.6 -3 7.2 0 t7.2 0 t7.2 0" fill="none" stroke="#EEF1F7" stroke-width="2.2" stroke-linecap="round"/>
    <text x="40" y="22.5" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" textLength="100" lengthAdjust="spacingAndGlyphs">quintaluz</text>
  </svg>
</div>

<main>
  <div class="card">
    <p class="code">404</p>
    <span class="mark"></span>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe neste portal. Ele pode ter sido digitado errado ou a página mudou de lugar.</p>
    <a class="btn" id="voltarMenu" href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      Voltar ao menu
    </a>
  </div>
</main>

<footer>Portal de Compras · projeto de portfólio com dados 100% sintéticos</footer>

<script>
  // Em um site de projeto do GitHub Pages (usuario.github.io/repositorio/...), o menu fica em /repositorio/.
  // Em outros endereços (servidor local, dominio proprio), fica na raiz.
  (function () {
    var link = document.getElementById('voltarMenu');
    var primeiro = location.pathname.split('/').filter(Boolean)[0];
    var projetoGithub = /\.github\.io$/i.test(location.hostname) && primeiro && primeiro.indexOf('.') === -1;
    link.href = projetoGithub ? '/' + primeiro + '/' : '/';
  })();
</script>
</body>
</html>
